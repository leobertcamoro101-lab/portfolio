# ============================================
# WORKFLOW 1: CI — runs on every Pull Request
#
# Triggers: when a PR is opened or updated
# Purpose: catch bugs before merging to main
# ============================================
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ============================================
  # JOB: build
  # A job is a set of steps that run together
  # on the same machine (runner)
  # ============================================
  build:
    name: Build & Lint
    # runs-on: which OS to use
    # ubuntu-latest = free Linux VM on GitHub
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out your code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'  # cache node_modules for speed

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci  # ci = clean install, faster than npm install

      # Step 4: Build the app
      # If build fails, the whole workflow fails
      - name: Build
        run: npm run build

      # Step 5: Upload build artifacts
      # Saves the dist/ folder so you can download it
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1